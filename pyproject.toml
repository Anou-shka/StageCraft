[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stagecraft"
version = "1.0.0"
description = "IFRS 9 expected credit loss engine on Freddie Mac loan-level mortgage data"
requires-python = ">=3.10"
dependencies = [
  "polars>=1.0", "pyarrow", "numpy", "pandas", "scipy", "scikit-learn", "statsmodels",
  "matplotlib", "pyyaml", "reportlab", "streamlit",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
